include /etc/nginx/snippets/vocaptest-security-headers.conf;

location = /VocaPTest {
    return 301 /VocaPTest/;
}

location = /VocaPTest/favicon.svg {
    alias /srv/vocaptest/app/web/dist/favicon.svg;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/snippets/vocaptest-security-headers.conf;
    try_files $uri =404;
}

location /VocaPTest/assets/ {
    alias /srv/vocaptest/app/web/dist/assets/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/snippets/vocaptest-security-headers.conf;
    try_files $uri =404;
}

location /VocaPTest/avatars/ {
    alias /srv/vocaptest/app/web/dist/avatars/;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    include /etc/nginx/snippets/vocaptest-security-headers.conf;
    try_files $uri =404;
}

location = /VocaPTest/api/analyze {
    limit_req zone=vocaptest_analyze burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 60m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /VocaPTest;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:8000/api/analyze;
}

location /VocaPTest/api/ {
    client_max_body_size 60m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /VocaPTest;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:8000/api/;
}

location = /api/analyze {
    limit_req zone=vocaptest_analyze burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 60m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:8000/api/analyze;
}

location /api/ {
    client_max_body_size 60m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_pass http://127.0.0.1:8000/api/;
}

location = /health {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8000/health;
}

location /VocaPTest/ {
    alias /srv/vocaptest/app/web/dist/;
    try_files $uri $uri/ /VocaPTest/index.html;
}
